name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the provider-reported default branch tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          default_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq .sha)
          tag_sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          test -n "$default_branch"
          test "$tag_sha" = "$default_sha"
      - name: Match the workspace version
        run: |
          workspace_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$workspace_version" = "$GITHUB_REF_NAME"

  promote:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Devcenter promotion token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: devcenter
      - name: Promote, sign and announce through Devcenter
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          run_url=$(gh workflow run promote-agent-platform.yml \
            --repo beyond10x/devcenter \
            --ref main \
            --field version="$GITHUB_REF_NAME" \
            --field source_commit="$GITHUB_SHA")
          grep -Eq '^https://github\.com/beyond10x/devcenter/actions/runs/[0-9]+$' <<<"$run_url"
          run_id=${run_url##*/}
          gh run watch "$run_id" --repo beyond10x/devcenter --exit-status

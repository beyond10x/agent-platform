[workspace]
resolver = "3"
members = [
    "crates/agent-platform-core",
    "crates/agent-platform-api",
    "crates/agent-platform-auth",
    "crates/agent-platform-connectors",
    "crates/agent-platform-harness",
    "crates/agent-platform-app",
    "crates/agent-platform-openapi",
    "crates/agent-platform-docs",
    "crates/agent-platform-http",
    "crates/agent-platform",
    "crates/agent-platform-client",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-B10x-Proprietary"
repository = "https://github.com/beyond10x/agent-platform"
authors = ["Timo Friedl <1379383+timofriedlberlin@users.noreply.github.com>"]
publish = false

[workspace.dependencies]
agent-platform-core = { path = "crates/agent-platform-core" }
agent-platform-api = { path = "crates/agent-platform-api" }
agent-platform-auth = { path = "crates/agent-platform-auth" }
agent-platform-connectors = { path = "crates/agent-platform-connectors" }
agent-platform-harness = { path = "crates/agent-platform-harness" }
agent-platform-app = { path = "crates/agent-platform-app" }
agent-platform-openapi = { path = "crates/agent-platform-openapi" }
agent-platform-docs = { path = "crates/agent-platform-docs" }
agent-platform-http = { path = "crates/agent-platform-http" }
agent-platform-client = { path = "crates/agent-platform-client" }

# Harness owns the neutral tool vocabulary consumed by the projection compiler. One exact release
# keeps this service from reinterpreting that boundary crate by crate.
harness-wire = { package = "b10x-harness-wire", git = "https://github.com/beyond10x/harness", tag = "0.10.0" }
harness-loop = { package = "b10x-harness-loop", git = "https://github.com/beyond10x/harness", tag = "0.10.0" }
harness-messages = { package = "b10x-harness-messages", git = "https://github.com/beyond10x/harness", tag = "0.10.0" }
identity-client = { git = "ssh://git@github.com/beyond10x/identity.git", tag = "0.3.1" }
connectors-client = { git = "ssh://git@github.com/beyond10x/connectors.git", tag = "v0.3.1" }

axum = "0.8"
async-stream = "0.3"
clap = { version = "4.6", features = ["derive"] }
futures-core = "0.3"
hex = "0.4"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
